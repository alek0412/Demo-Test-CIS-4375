<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Houston Badminton Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-login-page">
  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Admin</h1>
        <p>Sign in to the Houston Badminton Center admin dashboard</p>
      </div>
      <form action="Admin_Dashboard.html" method="get" class="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="email">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <p class="login-footer">© 2026 Houston Badminton Center</p>
    </div>
  </main>
</body>
</html>
