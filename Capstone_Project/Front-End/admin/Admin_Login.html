<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Houston Badminton Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../admin.css">
  <script src="../admin-theme.js" defer></script>
</head>
<body class="admin-login-page">
  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Admin</h1>
        <p>Sign in to the Houston Badminton Center admin dashboard</p>
      </div>
      <form id="login-form" class="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="email">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        <p id="login-error" class="login-error" role="alert" aria-live="polite" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      </form>
    </div>
  </main>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.hidden = true;
        errorEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password }),
          credentials: 'same-origin'
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.success) {
              window.location.href = 'Admin_Dashboard.html';
            } else {
              errorEl.textContent = data.message || 'Invalid email or password';
              errorEl.hidden = false;
              btn.disabled = false;
              btn.textContent = 'Sign in';
            }
          })
          .catch(function () {
            errorEl.textContent = 'Unable to reach server. Are you running the app from the backend server (e.g. http://localhost:3000)?';
            errorEl.hidden = false;
            btn.disabled = false;
            btn.textContent = 'Sign in';
          });
      });
    })();
  </script>
</body>
</html>
