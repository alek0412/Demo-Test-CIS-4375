<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Play — Houston Badminton Center</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .openplay-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .openplay-header .nav-right { margin: 0; }
    .openplay-close {
      position: static;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.2);
      background: #ffffff;
      color: #374151;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .openplay-close:hover {
      background: #f3f4f6;
      border-color: rgba(0, 0, 0, 0.3);
      color: #111827;
    }
    .openplay-frame-wrap {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      padding-top: 56px;
    }
    .openplay-frame-wrap iframe {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <header class="openplay-header">
    <a href="Client_Dashboard.html" class="openplay-close" aria-label="Close and return to dashboard">&times;</a>
    <div class="nav-right">
      <a href="Client_Login.html" class="nav-tab nav-auth-link">Log in</a>
    </div>
  </header>
  <div class="openplay-frame-wrap">
    <iframe src="../images/HBC-OpenPlay.pdf" title="How to Play at the Houston Badminton Center"></iframe>
  </div>
  <script src="/client-nav.js"></script>
</body>
</html>
