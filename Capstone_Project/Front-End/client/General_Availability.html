<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Times — Houston Badminton Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .hero { padding-top: 1.5rem; padding-bottom: 0.35rem; }
    section.features.features--availability {
      padding-top: 1.25rem;
      padding-bottom: 3rem;
    }
    .features--availability h2 {
      margin-bottom: 0.5rem;
    }
    .features--availability .availability-intro {
      margin: 0 auto 0;
      max-width: 42rem;
    }
    .availability-pdf {
      margin-top: 0;
      padding: 0 0 1.5rem;
      border-top: none;
    }
    .availability-pdf .pdf-canvas-wrap {
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
      padding: 0;
      background: transparent;
      border: 2px solid rgb(226, 222, 235);
      border-radius: var(--radius-sm);
      box-sizing: border-box;
      overflow: hidden;
      line-height: 0;
    }
    .availability-pdf .pdf-canvas-inner {
      line-height: 0;
    }
    .availability-pdf .pdf-canvas-inner canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }
    .availability-pdf .pdf-canvas-inner .popular-times-img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      vertical-align: top;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="General_Dashboard.html" class="logo"><img src="../images/HBC.png" alt="Houston Badminton Center" class="logo-img"></a>
        <div class="nav-tabs">
          <a href="General_Dashboard.html" class="nav-tab">Home</a>
          <a href="General_About.html" class="nav-tab">About</a>
          <a href="General_Availability.html" class="nav-tab active">Availability</a>
          <a href="General_Membership.html" class="nav-tab">Membership</a>
          <a href="General_AlternateServices.html" class="nav-tab">Alternate Services</a>
          <a href="General_Contact.html" class="nav-tab">Contact Us</a>
        </div>
        <div class="nav-right">
          <a href="Client_Login.html" class="nav-tab nav-auth-link">Log in</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Available Times</h1>
        <p>See when courts are free and pick a slot that works for you</p>
      </div>
    </section>

    <section class="features features--availability">
      <div class="container">
        <h2>Availability</h2>
        <p class="availability-intro" style="color: var(--text-muted); text-align: center;">See our most popular times and decide what works best for you.</p>
        <div class="availability-pdf">
          <div class="pdf-canvas-wrap">
            <div class="pdf-canvas-inner" id="popular-times-pdf"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Houston Badminton Center. All rights reserved.</p>
    </div>
  </footer>
  <script>
    (function() {
      var container = document.getElementById('popular-times-pdf');
      if (!container) return;
      var fallbackUrl = '/images/Popular-Times-at-HBC.pdf';
      var maxWidth = 960;
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      function renderPage(pdf, pageNum) {
        pdf.getPage(pageNum).then(function(page) {
          var baseScale = page.getViewport({ scale: 1 });
          var scale = (maxWidth / baseScale.width) * dpr;
          var viewport = page.getViewport({ scale: scale });
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = (viewport.width / dpr) + 'px';
          canvas.style.height = (viewport.height / dpr) + 'px';
          container.appendChild(canvas);
          page.render({ canvasContext: ctx, viewport: viewport });
        });
      }
      function loadPdf(url) {
        if (typeof pdfjsLib === 'undefined') {
          container.innerHTML = '<p style="color: var(--text-muted);">PDF viewer unavailable. <a href="' + url + '">Open PDF</a></p>';
          return;
        }
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        pdfjsLib.getDocument(url).promise.then(function(pdf) {
          for (var i = 1; i <= pdf.numPages; i++) renderPage(pdf, i);
        }).catch(function() {
          container.innerHTML = '<p style="color: var(--text-muted);">Unable to load PDF. <a href="' + url + '">Open PDF</a></p>';
        });
      }
      function loadImage(url) {
        container.innerHTML = '';
        var img = document.createElement('img');
        img.className = 'popular-times-img';
        img.src = url;
        img.alt = 'Popular times at Houston Badminton Center';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = function() {
          container.innerHTML = '<p style="color: var(--text-muted);">Unable to load image. <a href="' + url + '">Open file</a></p>';
        };
        container.appendChild(img);
      }
      function loadAsset(url, kind) {
        if (kind === 'image') loadImage(url);
        else loadPdf(url);
      }
      fetch('/api/popular-times-pdf')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var url = (d && d.url) ? d.url : fallbackUrl;
          var kind = d && d.kind === 'image' ? 'image' : 'pdf';
          loadAsset(url, kind);
        })
        .catch(function() {
          loadAsset(fallbackUrl, 'pdf');
        });
    })();
  </script>
  <script src="/client-nav.js"></script>
</body>
</html>
